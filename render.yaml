services:
  - type: web
    name: upsc-practice
    runtime: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: "0.0.0.0"
      - key: DB_FILE
        value: "/opt/render/project/src/data/upsc.db"
      - key: ADMIN_TOKEN
        generateValue: true
